name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify SEO artifacts
        run: |
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          test -f dist/index.html
          test -f dist/CNAME
          grep -q "ahmedmighri.com" dist/robots.txt
          grep -q "ahmedmighri.com" dist/sitemap-index.xml
